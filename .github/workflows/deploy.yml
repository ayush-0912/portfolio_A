name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx ng build --base-href /portfolio_A/

      - name: Prepare for GitHub Pages
        run: |
          OUT=$(find dist -type d -name browser | head -1)
          echo "Output folder: $OUT"
          cd "$OUT"
          if [ ! -f index.html ] && [ -f index.csr.html ]; then cp index.csr.html index.html; fi
          cp index.html 404.html
          echo "OUT_DIR=$OUT" >> $GITHUB_ENV

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4